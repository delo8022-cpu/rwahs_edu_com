{% load static %}
<header class="admin-header">
    <div class="header-container">
        <!-- Brand Logo & Name -->
        <div class="header-brand">
            <img src="{% static 'images/logo.png' %}" alt="রূপসা ওয়াহেদ আলী উচ্চ বিদ্যালয়" class="header-logo">
            <div class="brand-text">
                <h1 class="school-name">রূপসা ওয়াহেদ আলী উচ্চ বিদ্যালয়</h1>
                <p class="school-motto">এডমিন প্যানেল</p>
            </div>
        </div>
        
        <!-- Header Actions -->
        <div class="header-actions">
            <!-- User Info -->
            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-details">
                    <span class="user-name">{{ request.user.get_full_name|default:request.user.username }}</span>
                    <span class="user-role">এডমিন</span>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="quick-actions">
                <a href="/" class="action-btn" target="_blank" title="ওয়েবসাইট দেখুন">
                    <i class="fas fa-external-link-alt"></i>
                </a>
                <a href="{% url 'custom_admin:logout' %}" class="action-btn" title="লগআউট">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
            </div>
        </div>
    </div>
</header>
